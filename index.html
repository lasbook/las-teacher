<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>LAS AI Teacher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0c8ce9; overflow: hidden; }

    /* 상단바 */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      background: #0c8ce9;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      padding: 8px 16px;
    }
    .top-bar img {
      height: 34px;
      width: auto;
      display: block;
    }
    @media (max-width: 480px) {
      .top-bar img { height: 26px; }
    }

    /* 콘텐츠 */
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: min(340px, 88vw);
      aspect-ratio: 9 / 16;
      border: none;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- 상단바 -->
  <div class="top-bar" id="top-bar">
    <img src="text_title.png" alt="LAS AI Teacher" />
  </div>

  <!-- 콘텐츠 -->
  <div class="wrap" id="wrap">
    <iframe
      src="https://embed.liveavatar.com/v1/f4c1f024-6362-424b-ad1a-3636ef06b56f?orientation=vertical"
      allow="microphone"
      title="LAS AI Teacher">
    </iframe>
  </div>

  <script>
    function adjustLayout() {
      var bar = document.getElementById('top-bar');
      var wrap = document.getElementById('wrap');
      wrap.style.paddingTop = bar.offsetHeight + 'px';
    }
    adjustLayout();
    window.addEventListener('resize', adjustLayout);
    window.addEventListener('load', adjustLayout);
  </script>

</body>
</html>
